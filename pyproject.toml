[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waso-sona"
version = "0.1.0"
description = "A small, locally-trained Toki Pona language model and a desktop pet bird that renders and speaks it (sitelen pona UCSUR)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.7",
    "tensorboard>=2.18",
    "matplotlib>=3.9",
    # QLoRA fine-tune stack for google/gemma-4-E2B-it on RTX 5060 (8 GB).
    "transformers>=4.50",
    "peft>=0.13",
    "bitsandbytes>=0.43",
    "accelerate>=1.0",
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "trl>=0.12",
    # Required for the `use_liger_kernel=True` flag below — we don't actually
    # rely on Liger's kernels (Gemma 4 multimodal isn't in its registry; the
    # flag is a no-op patcher for us) but the flag makes TRL skip a vocab-
    # sized entropy metric in compute_loss that otherwise OOMs.
    "liger-kernel>=0.8",
    # The from-scratch student / talking-bird tokenizer is SentencePiece BPE;
    # train_student.py, talk_to_student.py, bench_student.py, and talk_to_bird.py
    # all import it.
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.setuptools.packages.find]
include = ["sitelen*"]
