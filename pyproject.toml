[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waso-sona"
version = "0.1.0"
description = "Bidirectional translator between Latin Toki Pona and sitelen pona UCSUR."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.7",
    "tensorboard>=2.18",
    "matplotlib>=3.9",
    # QLoRA fine-tune stack for google/gemma-4-E2B-it on RTX 5060 (8 GB).
    "transformers>=4.50",
    "peft>=0.13",
    "bitsandbytes>=0.43",
    "accelerate>=1.0",
    "datasets>=3.0",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.setuptools.packages.find]
include = ["sitelen*"]
