[package]
name = "desktop-bird"
version = "0.1.0"
edition = "2024"
description = "A desktop pet bird that perches on the active window and flies around (Wayland: KWin + COSMIC)"
# MIT: all deps are MIT, and the COSMIC protocol bindings are generated from a
# vendored HPND-licensed XML (protocols/) rather than the GPL cosmic crates.
license = "MIT"

[dependencies]
# Wayland client + layer-shell (the shared renderer is built on these).
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
# Pseudo-random wander for the placeholder motion driver.
rand = "0.10"
# Optional sprite source: load PNG animation frames. Only the png decoder is needed.
image = { version = "0.25", default-features = false, features = ["png"] }
# COSMIC window tracking: ext-foreign-toplevel-list (staging) + our own
# bindings for cosmic-toplevel-info, generated by wayland-scanner from the
# vendored HPND XML in protocols/. All MIT.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
