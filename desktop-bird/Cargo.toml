[workspace]
# desktop-bird is both the workspace root and the bird package. The control
# panel and the shared wire-types crate are additional members.
members = ["protocol", "panel"]

[package]
name = "desktop-bird"
version = "0.1.0"
edition = "2024"
description = "A desktop pet bird that perches on the active window and flies around (Wayland: KWin + COSMIC)"
# MIT: all deps are MIT, and the COSMIC protocol bindings are generated from a
# vendored HPND-licensed XML (protocols/) rather than the GPL cosmic crates.
license = "MIT"

[dependencies]
# Wayland client + layer-shell (the shared renderer is built on these).
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
# Pseudo-random wander for the placeholder motion driver.
rand = "0.10"
# Optional sprite source: load PNG animation frames. Only the png decoder is needed.
image = { version = "0.25", default-features = false, features = ["png"] }
# Speech-bubble text: rasterize the bundled nasin-nanpa OTF (MIT) at the UCSUR
# codepoints to draw sitelen pona. Pure-Rust, no_std-capable; MIT/Apache-2.0/Zlib.
fontdue = "0.9"
# COSMIC window tracking: ext-foreign-toplevel-list (staging) + our own
# bindings for cosmic-toplevel-info, generated by wayland-scanner from the
# vendored HPND XML in protocols/. All MIT.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-scanner = "0.31"
wayland-backend = "0.3"
# KWin (Plasma 6) window tracking: a KWin script (kwin/perch.js) runs inside the
# compositor and pushes the active window's geometry over the session bus to a
# service we register here. zbus is pure-Rust and MIT — consistent with this
# crate's MIT-only policy (vs. libdbus-linked dbus-rs). No tokio feature: zbus
# 5 defaults to its own internal async executor thread.
zbus = "5"
# Live tuning: the control panel (bird-panel) sends ControlMsgs over a Unix
# socket as newline-delimited JSON. Shared wire types live in the protocol crate.
bird-protocol = { path = "protocol" }
serde_json = "1"
